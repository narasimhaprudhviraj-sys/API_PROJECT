<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - Academic Admin Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="admin-dashboard.html">
                <i class="bi bi-shield-shaded fs-3 me-2 text-warning"></i>
                <span>ACADEMIC ADMIN CONSOLE</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="manage-courses.html">Manage Courses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="add-course.html">Add Course</a></li>
                    <li class="nav-item"><a class="nav-link" href="manage-students.html">Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="registrations.html">Registrations</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center" id="navUserSection"></ul>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container py-5">
        <div class="form-card" style="max-width: 760px;">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-primary text-white p-3 rounded-3 me-3 fs-3">
                    <i class="bi bi-journal-plus"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Add New Course Offering</h3>
                    <p class="text-muted small mb-0">Introduce a new accredited course into the college catalog.</p>
                </div>
            </div>

            <form id="addCourseForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Course Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="courseCode" placeholder="e.g. CS401" required>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label">Course Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="courseName" placeholder="e.g. Distributed Cloud Systems" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Course Description / Syllabus</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Summary of topics, labs, prerequisites..."></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Department <span class="text-danger">*</span></label>
                        <select class="form-select" id="department" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science & Engineering (CSE)</option>
                            <option value="IT">Information Technology (IT)</option>
                            <option value="AIML">Artificial Intelligence & ML (AIML)</option>
                            <option value="ECE">Electronics & Communication (ECE)</option>
                            <option value="MECH">Mechanical Engineering (MECH)</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Credits <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="credits" min="1" max="10" value="4" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Duration <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="duration" placeholder="e.g. 12 Weeks" value="12 Weeks" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Faculty In-Charge <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="facultyName" placeholder="e.g. Dr. Johnathan Miller" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Maximum Seats <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="maxSeats" min="1" value="30" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Initial Status <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" required>
                            <option value="ACTIVE" selected>ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="manage-courses.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom fw-bold px-4" id="saveCourseBtn">
                        <span id="cSpinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
                        Save & Publish Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const admin = requireAdminAuth();
            if (!admin) return;
        });

        document.getElementById('addCourseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const btn = document.getElementById('saveCourseBtn');
            const spinner = document.getElementById('cSpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            const payload = {
                courseCode: document.getElementById('courseCode').value.trim(),
                courseName: document.getElementById('courseName').value.trim(),
                description: document.getElementById('description').value.trim(),
                department: document.getElementById('department').value,
                credits: parseInt(document.getElementById('credits').value, 10),
                duration: document.getElementById('duration').value.trim(),
                facultyName: document.getElementById('facultyName').value.trim(),
                maxSeats: parseInt(document.getElementById('maxSeats').value, 10),
                availableSeats: parseInt(document.getElementById('maxSeats').value, 10),
                status: document.getElementById('status').value
            };

            try {
                const response = await apiCall('/courses', 'POST', payload);
                showAlert('Course created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'manage-courses.html';
                }, 900);
            } catch (err) {
                showAlert(err.message, 'danger');
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
