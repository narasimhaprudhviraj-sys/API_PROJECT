<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Portal Login - Online Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-mortarboard-fill fs-3 me-2 text-warning"></i>
                <span>ACADEMIC COURSE REGISTRATION</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center" id="navUserSection"></ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="form-card" style="max-width: 520px;">
            <div class="text-center mb-4">
                <div class="bg-dark text-warning d-inline-flex p-3 rounded-circle mb-3 shadow-sm">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h3 class="fw-bold">Administrator Portal</h3>
                <p class="text-muted small">Course catalog maintenance, student enrollment reports, and academic capacity management.</p>
            </div>

            <form id="adminLoginForm">
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Administrator Email <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                        <input type="email" class="form-control" id="adminEmail" placeholder="admin@college.edu" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="adminPassword" class="form-label">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" id="adminPassword" placeholder="Enter administrative password" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-dark btn-lg fw-bold shadow-sm" id="adminLoginBtn">
                        <span id="adminSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                        Admin Sign In
                    </button>
                </div>

                <!-- Sample Credentials Auto-fill -->
                <div class="alert alert-light border small text-muted mb-3">
                    <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1"></i> Default Academic Admin:</div>
                    <code>admin@college.edu</code> / <code>admin123</code>
                    <button type="button" class="btn btn-sm btn-link p-0 ms-2 text-decoration-none" onclick="fillAdminAccount()">Auto-fill</button>
                </div>

                <div class="text-center">
                    <a href="student-login.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Switch to Student Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        function fillAdminAccount() {
            document.getElementById('adminEmail').value = 'admin@college.edu';
            document.getElementById('adminPassword').value = 'admin123';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('adminLoginBtn');
            const spinner = document.getElementById('adminSpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            const payload = {
                email: document.getElementById('adminEmail').value.trim(),
                password: document.getElementById('adminPassword').value
            };

            try {
                const response = await apiCall('/admin/login', 'POST', payload);
                if (response.success) {
                    Auth.setAdmin(response);
                    showAlert('Admin authenticated! Opening admin console...', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 800);
                } else {
                    showAlert(response.message || 'Authentication failed.', 'danger');
                }
            } catch (err) {
                showAlert(err.message, 'danger');
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
