<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Online Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-mortarboard-fill fs-3 me-2 text-warning"></i>
                <span>ACADEMIC COURSE REGISTRATION</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="student-dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Browse Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-courses.html">My Registrations</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center" id="navUserSection"></ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="form-card" style="max-width: 720px;">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-primary text-white p-3 rounded-circle me-3 fs-3">
                    <i class="bi bi-person-lines-fill"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Student Profile</h3>
                    <p class="text-muted small mb-0">Review and update your academic student records.</p>
                </div>
            </div>

            <form id="profileForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="pName" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="pEmail" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Roll Number <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="pRollNo" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Department <span class="text-danger">*</span></label>
                        <select class="form-select" id="pDept" required>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="AIML">AIML</option>
                            <option value="ECE">ECE</option>
                            <option value="MECH">MECH</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Academic Year <span class="text-danger">*</span></label>
                        <select class="form-select" id="pYear" required>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="pPhone" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">New Password <small class="text-muted">(Leave empty to keep existing password)</small></label>
                        <input type="password" class="form-control" id="pPassword" placeholder="Enter new password if changing">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="student-dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom fw-bold px-4" id="saveProfileBtn">
                        <span id="pSpinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        let studentData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const student = requireStudentAuth();
            if (!student) return;

            try {
                studentData = await apiCall(`/students/${student.userId}`);
                document.getElementById('pName').value = studentData.name;
                document.getElementById('pEmail').value = studentData.email;
                document.getElementById('pRollNo').value = studentData.rollNo;
                document.getElementById('pDept').value = studentData.department;
                document.getElementById('pYear').value = studentData.year;
                document.getElementById('pPhone').value = studentData.phone;
            } catch (err) {
                showAlert('Failed to load profile details: ' + err.message, 'danger');
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student = Auth.getStudent();
            const btn = document.getElementById('saveProfileBtn');
            const spinner = document.getElementById('pSpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            const payload = {
                name: document.getElementById('pName').value.trim(),
                email: document.getElementById('pEmail').value.trim(),
                rollNo: document.getElementById('pRollNo').value.trim(),
                department: document.getElementById('pDept').value,
                year: parseInt(document.getElementById('pYear').value, 10),
                phone: document.getElementById('pPhone').value.trim()
            };

            const newPass = document.getElementById('pPassword').value;
            if (newPass && newPass.trim().length >= 4) {
                payload.password = newPass.trim();
            }

            try {
                const updated = await apiCall(`/students/${student.userId}/self`, 'PUT', payload);
                showAlert('Profile updated successfully!', 'success');
                // Update local storage student name if changed
                student.name = updated.name;
                student.email = updated.email;
                Auth.setStudent(student);
            } catch (err) {
                showAlert(err.message, 'danger');
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
